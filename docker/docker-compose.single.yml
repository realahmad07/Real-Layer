services:
  relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      GHOST_NETWORK_ENVIRONMENT: production
      GHOST_NODE_ID: ${GHOST_NODE_ID:-cloud-relay}
      GHOST_RELAY_ROLE: ${GHOST_RELAY_ROLE:-both}
      GHOST_LISTEN_ADDRESS: /ip4/0.0.0.0/udp/7000/quic-v1
      GHOST_ADVERTISED_ADDRESS: /ip4/${GHOST_PUBLIC_IP:?set GHOST_PUBLIC_IP}/udp/${GHOST_QUIC_PORT:-7000}/quic-v1
      GHOST_IDENTITY_PATH: /var/lib/ghost-layer/identity/relay.key
      GHOST_BOOTSTRAP_PEERS: ${GHOST_BOOTSTRAP_PEERS:-}
      GHOST_ALLOWED_EXIT_DESTINATIONS: ${GHOST_ALLOWED_EXIT_DESTINATIONS:-}
      GHOST_EXTERNAL_TEST_DESTINATION: ${GHOST_EXTERNAL_TEST_DESTINATION:-}
      GHOST_DNS_SERVER: ${GHOST_DNS_SERVER:-}
      GHOST_UDP_ENABLED: ${GHOST_UDP_ENABLED:-false}
      GHOST_DNS_ENABLED: ${GHOST_DNS_ENABLED:-false}
      GHOST_NAT_ENABLED: ${GHOST_NAT_ENABLED:-false}
      GHOST_HEALTH_LISTEN_ADDRESS: 127.0.0.1:8080
      GHOST_LOG_LEVEL: ${GHOST_LOG_LEVEL:-info}
    ports:
      - "${GHOST_QUIC_PORT:-7000}:7000/udp"
    volumes:
      - relay-identity:/var/lib/ghost-layer/identity
    restart: unless-stopped

volumes:
  relay-identity: