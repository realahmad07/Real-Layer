[workspace]
members = [
    "client",
    "relay",
    "network",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chacha20poly1305 = "0.10"
futures = "0.3"
hkdf = "0.12"
libp2p = { version = "0.56", features = ["identify", "macros", "ping", "quic", "request-response", "tokio"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
